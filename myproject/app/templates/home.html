<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>
    <h1>Latest Posts</h1>
    <a href="{% url 'about' %}">About Us</a>
    <hr>

    {% for post in posts %}
        <div style="border-bottom: 1px solid #ccc; margin-bottom: 20px;">
            
            <h2>{{ post.title }}</h2>
            <small>By {{ post.author }} on {{ post.created_at }}</small>
            
            <p>{{ post.body }}</p>
            
        </div>
    {% empty %}
        <p>No posts found. Please add some via the Admin panel.</p>
    {% endfor %}

</body>
</html>
