services:
  api:
    build: ./backend
    container_name: inventory_api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/inventory_system
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: inventory_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  frontend:
    build: ./frontend
    container_name: inventory_frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
